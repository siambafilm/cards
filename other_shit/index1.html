<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои карточки</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card-bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4255ff;
    --accent-hover: #3140cc;
    --green: #10b981;
    --red: #ef4444;
    --shadow: 0 10px 30px rgba(0,0,0,.08);
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 760px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- Языки (глобальные) ---- */
  .lang-switch {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .lang-btn {
    flex: 1;
    padding: 14px 18px;
    background: #fff;
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s, transform .1s;
    font-family: inherit;
  }
  .lang-btn:hover:not(.active) { color: var(--text); border-color: #cbd5e1; }
  .lang-btn:active { transform: scale(.99); }
  .lang-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #eef0ff;
  }
  .lang-btn .lang-emoji { margin-right: 6px; }

  /* ---- Подрежимы (Карточки / Тест / Подбор) ---- */
  .tabs {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 6px;
    background: #e5e7eb;
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .tab {
    flex: 1;
    padding: 10px 14px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-size: .95rem;
    transition: background .15s, color .15s;
    font-family: inherit;
  }
  .tab:hover:not(.active) { color: var(--text); }
  .tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .progress-bar {
    width: 100%;
    max-width: 760px;
    height: 8px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .35s ease;
  }

  .view { display: none; width: 100%; max-width: 760px; }
  .view.active { display: block; }

  /* ---- Карточка ---- */
  .card-scene {
    width: 100%; height: 380px; perspective: 1200px; cursor: pointer; margin-bottom: 24px;
  }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
    border-radius: var(--radius);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: var(--radius); background: var(--card-bg);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 32px; text-align: center; overflow-y: auto;
  }
  .card-face.back { transform: rotateY(180deg); }

  .label {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin-bottom: 16px; font-weight: 600;
  }
  .content { font-size: 1.6rem; line-height: 1.5; font-weight: 500; word-break: break-word; white-space: pre-wrap; }
  .hint { margin-top: 24px; font-size: .85rem; color: var(--muted); }
  .tags { margin-top: 18px; font-size: .75rem; color: var(--muted); font-style: italic; }

  .question-panel {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px 32px; text-align: center; margin-bottom: 20px;
    min-height: 180px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .answer-input {
    width: 100%; padding: 16px 18px; font-size: 1.1rem;
    border: 2px solid #d1d5db; border-radius: 12px;
    font-family: inherit; transition: border-color .2s, background .2s;
    margin-bottom: 14px; color: var(--text); background: #fff;
  }
  .answer-input:focus { outline: none; border-color: var(--accent); }
  .answer-input.correct { border-color: var(--green); background: #ecfdf5; }
  .answer-input.wrong   { border-color: var(--red);   background: #fef2f2; }
  .answer-input:disabled { opacity: .95; }

  .feedback {
    padding: 12px 16px; border-radius: 10px; font-size: .95rem;
    margin-bottom: 14px; display: none; line-height: 1.5; text-align: left;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #ecfdf5; color: #065f46; }
  .feedback.wrong   { background: #fef2f2; color: #991b1b; }
  .feedback strong { font-weight: 700; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
  .option {
    padding: 18px 20px; background: var(--card-bg);
    border: 2px solid #e5e7eb; border-radius: 14px;
    font-size: 1rem; text-align: left; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    font-family: inherit; color: var(--text); font-weight: 500; line-height: 1.4;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: #f9fafb; }
  .option:active:not(:disabled) { transform: scale(.99); }
  .option.correct { border-color: var(--green); background: #ecfdf5; color: #065f46; }
  .option.wrong   { border-color: var(--red);   background: #fef2f2; color: #991b1b; }
  .option:disabled { cursor: default; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
  button {
    border: none; border-radius: 12px; padding: 13px 26px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .2s, transform .1s; font-family: inherit;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-know { background: var(--green); color: #fff; }
  .btn-know:hover:not(:disabled) { background: #0d9668; }
  .btn-repeat { background: #fee2e2; color: var(--red); }
  .btn-repeat:hover:not(:disabled) { background: #fecaca; }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1.5px solid #d1d5db; padding: 11px 22px;
  }
  .btn-ghost:hover:not(:disabled) { background: #f3f4f6; }

  .stats {
    font-size: .9rem; color: var(--muted);
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
  }
  .stats strong { color: var(--text); }

  .status-banner {
    width: 100%; max-width: 760px; padding: 12px 16px;
    border-radius: 12px; font-size: .9rem; margin-bottom: 16px;
    text-align: center; line-height: 1.5;
  }
  .status-banner.warn { background: #fef3c7; color: #92400e; }
  .status-banner.info { background: #dbeafe; color: #1e40af; }
  .status-banner.ok   { background: #d1fae5; color: #065f46; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: #fff; border-radius: var(--radius); padding: 32px;
    width: 100%; max-width: 520px; box-shadow: var(--shadow);
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 20px; }
  .modal label {
    display: block; font-size: .85rem; font-weight: 600;
    margin-bottom: 6px; color: var(--muted);
  }
  .modal input, .modal textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #d1d5db; border-radius: 10px;
    font-size: 1rem; font-family: inherit; margin-bottom: 14px;
    resize: vertical; transition: border-color .2s; color: var(--text);
  }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .modal-error {
    background: #fef2f2; color: #991b1b;
    padding: 10px 14px; border-radius: 8px; font-size: .85rem;
    margin-bottom: 12px; display: none;
  }
  .modal-error.show { display: block; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  @media (max-width: 600px) {
    .card-scene { height: 320px; }
    .content { font-size: 1.25rem; }
    .card-face { padding: 28px 20px; }
    .question-panel { padding: 28px 20px; }
    header h1 { font-size: 1.2rem; }
    .tab { font-size: .85rem; padding: 9px 8px; }
    .lang-btn { font-size: .9rem; padding: 12px 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>📇 Мои карточки</h1>
  <div class="header-actions">
    <button class="btn-ghost" id="restartBtn" title="Сбросить прогресс текущего языка">↻ Заново</button>
    <button class="btn-ghost" id="addBtn">+ Добавить</button>
  </div>
</header>

<!-- Глобальный переключатель языка -->
<div class="lang-switch" id="langSwitch">
  <button class="lang-btn active" data-lang="latin">
    <span class="lang-emoji">🏛️</span>Латинский
  </button>
  <button class="lang-btn" data-lang="english">
    <span class="lang-emoji">🇬🇧</span>Английский
  </button>
</div>

<!-- Подрежимы -->
<div class="tabs" id="tabs">
  <button class="tab active" data-mode="flashcard">Карточки</button>
  <button class="tab" data-mode="test">Тест</button>
  <button class="tab" data-mode="match">Подбор</button>
</div>

<div id="statusBanner" class="status-banner warn" style="display:none;"></div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- ======================= Карточки ======================= -->
<div class="view" data-mode="flashcard">
  <div class="card-scene" id="cardScene">
    <div class="card" id="card">
      <div class="card-face front">
        <div class="label">Вопрос</div>
        <div class="content" id="fcFront">Загрузка...</div>
        <div class="hint">Нажмите, чтобы увидеть ответ</div>
        <div class="tags" id="fcFrontTags"></div>
      </div>
      <div class="card-face back">
        <div class="label">Ответ</div>
        <div class="content" id="fcBack"></div>
        <div class="tags" id="fcBackTags"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn-repeat" id="fcRepeat">↺ Повторить</button>
    <button class="btn-know" id="fcKnow">✓ Знаю</button>
  </div>
</div>

<!-- ======================= Тест ======================= -->
<div class="view" data-mode="test">
  <div class="question-panel">
    <div class="label">Вопрос</div>
    <div class="content" id="testFront"></div>
  </div>
  <input type="text" class="answer-input" id="testInput" placeholder="Введите ответ..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="feedback" id="testFeedback"></div>
  <div class="controls">
    <button class="btn-repeat" id="testRepeat" style="display:none">↺ Повторить</button>
    <button class="btn-primary" id="testCheck">Проверить</button>
    <button class="btn-know" id="testKnowAnyway" style="display:none">✓ Всё равно знаю</button>
    <button class="btn-know" id="testNext" style="display:none">Дальше →</button>
  </div>
</div>

<!-- ======================= Подбор ======================= -->
<div class="view" data-mode="match">
  <div class="question-panel">
    <div class="label">Выберите правильный ответ</div>
    <div class="content" id="matchFront"></div>
  </div>
  <div class="options" id="matchOptions"></div>
  <div class="controls">
    <button class="btn-repeat" id="matchRepeat" style="display:none">↺ Повторить</button>
    <button class="btn-know" id="matchKnowAnyway" style="display:none">✓ Всё равно знаю</button>
    <button class="btn-know" id="matchNext" style="display:none">Дальше →</button>
  </div>
</div>

<!-- ======================= Финал ======================= -->
<div class="view" id="doneView" style="display:none">
  <div class="question-panel">
    <div class="content">🎉 Все карточки пройдены!</div>
    <div style="margin-top: 20px; color: var(--muted)">Нажмите «↻ Заново», чтобы начать с начала</div>
  </div>
</div>

<div class="stats">
  <span>Осталось: <strong id="remaining">0</strong></span>
  <span>Выучено: <strong id="learned">0</strong></span>
  <span>Всего: <strong id="total">0</strong></span>
</div>

<!-- ======================= Модалка ======================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Новая карточка</h2>
    <div class="modal-error" id="modalError"></div>
    <label for="newFront" id="labelFront">Вопрос</label>
    <textarea id="newFront" rows="3" placeholder="Введите вопрос..."></textarea>
    <label for="newBack" id="labelBack">Ответ</label>
    <textarea id="newBack" rows="3" placeholder="Введите ответ..."></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelModal">Отмена</button>
      <button class="btn-primary" id="saveModal">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  КОНФИГ ЯЗЫКОВ
// ============================================================
const LANGS = {
  latin: {
    title: '🏛️ Латинский',
    file: 'latin.json',
    storageKey: 'flashcards_state_v2_latin',
    // Что показывать в тесте и подборе, что писать в ответ.
    // front — «лицо» карточки (латинское слово), back — перевод.
    // Если у вас наоборот — поменяйте местами.
    questionField: 'back',   // показываем перевод
    answerField:   'front',  // просим ввести латинское слово
    placeholder: 'Введите слово на латыни...',
    // Подсказки в модалке добавления
    frontLabel: 'Слово (латынь)',
    backLabel:  'Перевод (русский)',
    frontPlaceholder: 'например: aqua',
    backPlaceholder:  'например: вода',
  },
  english: {
    title: '🇬🇧 Английский',
    file: 'english.json',
    storageKey: 'flashcards_state_v2_english',
    questionField: 'back',
    answerField:   'front',
    placeholder: 'Введите слово на английском...',
    frontLabel: 'Слово (английский)',
    backLabel:  'Перевод (русский)',
    frontPlaceholder: 'например: water',
    backPlaceholder:  'например: вода',
  },
};

const ADD_URL = 'add_card.php';

// Демо-карточки, если JSON не загрузился (открытие через file://)
const FALLBACK = {
  latin: [
    { id: 'l1', front: 'aqua',  back: 'вода' },
    { id: 'l2', front: 'ignis', back: 'огонь' },
    { id: 'l3', front: 'terra', back: 'земля' },
    { id: 'l4', front: 'ventus', back: 'ветер' },
  ],
  english: [
    { id: 'e1', front: 'water', back: 'вода' },
    { id: 'e2', front: 'fire',  back: 'огонь' },
    { id: 'e3', front: 'earth', back: 'земля' },
    { id: 'e4', front: 'wind',  back: 'ветер' },
  ],
};

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
let currentLang = 'latin';
let allCards    = [];
let queue       = [];
let learned     = [];
let mode        = 'flashcard';
let flipped     = false;
let testState   = null;
let matchState  = null;

// ============================================================
//  DOM
// ============================================================
const $ = (id) => document.getElementById(id);
const cardEl       = $('card');
const fcFront      = $('fcFront');
const fcBack       = $('fcBack');
const fcFrontTags  = $('fcFrontTags');
const fcBackTags   = $('fcBackTags');
const testFront    = $('testFront');
const testInput    = $('testInput');
const testFeedback = $('testFeedback');
const testCheckBtn = $('testCheck');
const testRepeatBtn= $('testRepeat');
const testNextBtn  = $('testNext');
const testKnowBtn  = $('testKnowAnyway');
const matchFront   = $('matchFront');
const matchOptions = $('matchOptions');
const matchRepeatBtn = $('matchRepeat');
const matchNextBtn   = $('matchNext');
const matchKnowBtn   = $('matchKnowAnyway');
const fcRepeatBtn  = $('fcRepeat');
const fcKnowBtn    = $('fcKnow');
const progressFill = $('progressFill');
const remainingEl  = $('remaining');
const learnedEl    = $('learned');
const totalEl      = $('total');
const statusBanner = $('statusBanner');
const modalOverlay = $('modalOverlay');
const modalError   = $('modalError');
const newFront     = $('newFront');
const newBack      = $('newBack');

// ============================================================
//  УТИЛИТЫ
// ============================================================
function cfg() { return LANGS[currentLang]; }

function cardKey(c) {
  return c.id ? 'id:' + c.id : 'k:' + (c.front || '') + '\x00' + (c.back || '');
}

function normalize(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatTags(tags) {
  return tags && tags.length ? '#' + tags.join(' #') : '';
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showBanner(text, kind = 'warn', ms = 0) {
  statusBanner.textContent = text;
  statusBanner.className = 'status-banner ' + kind;
  statusBanner.style.display = 'block';
  if (ms > 0) {
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => { statusBanner.style.display = 'none'; }, ms);
  }
}
function hideBanner() { statusBanner.style.display = 'none'; }

// ============================================================
//  СОХРАНЕНИЕ ПРОГРЕССА (для каждого языка — свой ключ)
// ============================================================
function saveState() {
  try {
    localStorage.setItem(cfg().storageKey, JSON.stringify({
      v: 2,
      mode,
      learned: learned.map(cardKey),
      queue:   queue.map(cardKey),
    }));
    localStorage.setItem('flashcards_last_lang', currentLang);
  } catch (e) {
    console.warn('Не удалось сохранить прогресс:', e);
  }
}

function loadSavedState() {
  try {
    const raw = localStorage.getItem(cfg().storageKey);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearSavedState() {
  try { localStorage.removeItem(cfg().storageKey); } catch {}
}

// ============================================================
//  СЕССИЯ
// ============================================================
function startFresh() {
  queue = shuffle([...allCards]);   // ← всегда в разнобой
  learned = [];
  flipped = false;
  testState = null;
  matchState = null;
  render();
}

function restoreSession(saved) {
  const byKey = new Map();
  for (const c of allCards) byKey.set(cardKey(c), c);

  const learnedCards = [];
  const queueCards = [];
  const usedKeys = new Set();

  if (saved) {
    for (const k of saved.learned || []) {
      const c = byKey.get(k);
      if (c && !usedKeys.has(k)) { learnedCards.push(c); usedKeys.add(k); }
    }
    for (const k of saved.queue || []) {
      const c = byKey.get(k);
      if (c && !usedKeys.has(k)) { queueCards.push(c); usedKeys.add(k); }
    }
  }

  // Новые карточки — в конец очереди, в случайном порядке
  const fresh = [];
  for (const c of allCards) {
    const k = cardKey(c);
    if (!usedKeys.has(k)) { fresh.push(c); usedKeys.add(k); }
  }
  queue = queueCards.concat(shuffle(fresh));

  learned = learnedCards;
  mode = (saved && saved.mode) || 'flashcard';
  if (!['flashcard', 'test', 'match'].includes(mode)) mode = 'flashcard';
  flipped = false;
  testState = null;
  matchState = null;
  render();
}

function currentCard() { return queue.length > 0 ? queue[0] : null; }

function markKnown() {
  if (!currentCard()) return;
  learned.push(queue.shift());
  flipped = false; testState = null; matchState = null;
  render();
}

function markRepeat() {
  if (!currentCard()) return;
  queue.push(queue.shift());
  flipped = false; testState = null; matchState = null;
  render();
}

// ============================================================
//  РЕНДЕР
// ============================================================
function render() {
  updateProgress();
  updateTabs();
  renderActiveView();
  saveState();
}

function updateProgress() {
  const total = allCards.length;
  const done = learned.length;
  progressFill.style.width = (total ? done / total * 100 : 0) + '%';
  remainingEl.textContent = queue.length;
  learnedEl.textContent = done;
  totalEl.textContent = total;
}

function updateTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
}

function renderActiveView() {
  const c = currentCard();
  const done = !c;

  $('doneView').style.display = done ? 'block' : 'none';
  document.querySelectorAll('.view[data-mode]').forEach(v => {
    v.classList.toggle('active', !done && v.dataset.mode === mode);
  });

  if (done) return;

  if (mode === 'flashcard') renderFlashcard(c);
  else if (mode === 'test') renderTest(c);
  else if (mode === 'match') renderMatch(c);
}

function renderFlashcard(c) {
  fcFront.textContent = c.front || '(пусто)';
  fcBack.textContent  = c.back  || '(пусто)';
  fcFrontTags.textContent = formatTags(c.tags);
  fcBackTags.textContent  = formatTags(c.tags);
  cardEl.classList.remove('flipped');
  flipped = false;
}

function renderTest(c) {
  const conf = cfg();
  const q = c[conf.questionField] || '(пусто)';

  testFront.textContent = q;
  testInput.value = '';
  testInput.disabled = false;
  testInput.className = 'answer-input';
  testInput.placeholder = conf.placeholder;
  testFeedback.className = 'feedback';
  testFeedback.textContent = '';
  testCheckBtn.style.display = '';
  testNextBtn.style.display = 'none';
  testRepeatBtn.style.display = 'none';
  testKnowBtn.style.display = 'none';
  testState = { checked: false, correct: false };
  if (window.innerWidth > 700) testInput.focus();
}

function renderMatch(c) {
  const conf = cfg();
  matchFront.textContent = c[conf.questionField] || '(пусто)';
  matchRepeatBtn.style.display = 'none';
  matchNextBtn.style.display = 'none';
  matchKnowBtn.style.display = 'none';

  const correct = c[conf.answerField] || '(пусто)';
  const pool = Array.from(new Set(
    allCards.map(x => x[conf.answerField]).filter(b => b && b !== correct)
  ));
  shuffle(pool);
  const nOptions = Math.min(4, pool.length + 1);
  const opts = [correct, ...pool.slice(0, nOptions - 1)];
  shuffle(opts);

  matchState = { options: opts, correct, picked: -1 };
  matchOptions.innerHTML = '';
  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => pickMatchOption(i));
    matchOptions.appendChild(btn);
  });
}

// ============================================================
//  ТЕСТ
// ============================================================
function checkTest() {
  const c = currentCard();
  if (!c || !testState) return;
  if (testState.checked) return;

  const conf = cfg();
  const expected = normalize(c[conf.answerField]);
  const user = normalize(testInput.value);
  const correct = user !== '' && user === expected;

  testState.checked = true;
  testState.correct = correct;
  testInput.disabled = true;
  testInput.classList.add(correct ? 'correct' : 'wrong');
  testCheckBtn.style.display = 'none';

  if (correct) {
    testFeedback.className = 'feedback correct show';
    testFeedback.innerHTML = '<strong>✓ Верно!</strong>';
    testNextBtn.style.display = '';
  } else {
    testFeedback.className = 'feedback wrong show';
    testFeedback.innerHTML =
      '<strong>✗ Неверно.</strong><br>' +
      'Правильный ответ: <strong>' + escapeHtml(expected || '(пусто)') + '</strong>';
    testRepeatBtn.style.display = '';
    testKnowBtn.style.display = '';
  }
}

// ============================================================
//  ПОДБОР
// ============================================================
function pickMatchOption(idx) {
  if (!matchState || matchState.picked !== -1) return;
  if (!currentCard()) return;

  matchState.picked = idx;
  const picked  = matchState.options[idx];
  const correct = matchState.correct;
  const isCorrect = picked === correct;

  const btns = matchOptions.querySelectorAll('.option');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (matchState.options[i] === correct) b.classList.add('correct');
    if (i === idx && !isCorrect) b.classList.add('wrong');
  });

  if (isCorrect) matchNextBtn.style.display = '';
  else { matchRepeatBtn.style.display = ''; matchKnowBtn.style.display = ''; }
}

// ============================================================
//  МОДАЛКА
// ============================================================
function updateModalForLang() {
  const conf = cfg();
  $('modalTitle').textContent = 'Новая карточка — ' + conf.title;
  $('labelFront').textContent = conf.frontLabel;
  $('labelBack').textContent  = conf.backLabel;
  newFront.placeholder = conf.frontPlaceholder;
  newBack.placeholder  = conf.backPlaceholder;
}

function openModal() {
  updateModalForLang();
  newFront.value = '';
  newBack.value = '';
  modalError.classList.remove('show');
  modalError.textContent = '';
  modalOverlay.classList.add('open');
  newFront.focus();
}
function closeModal() { modalOverlay.classList.remove('open'); }

async function saveNewCard() {
  const front = newFront.value.trim();
  const back  = newBack.value.trim();

  if (!front || !back) {
    modalError.textContent = 'Заполните оба поля.';
    modalError.classList.add('show');
    return;
  }

  const btn = $('saveModal');
  btn.disabled = true;
  btn.textContent = 'Сохранение...';
  modalError.classList.remove('show');

  try {
    const res = await fetch(ADD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: currentLang, front, back }),
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      throw new Error(data.error || ('Ошибка сервера: HTTP ' + res.status));
    }

    const newCard = { id: data.id || ('local-' + Date.now()), front, back };
    allCards.push(newCard);
    queue.push(newCard);

    closeModal();
    showBanner('✓ Карточка добавлена в ' + cfg().title, 'ok', 2500);
    render();
  } catch (e) {
    modalError.textContent = e.message || 'Не удалось сохранить карточку.';
    modalError.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Сохранить';
  }
}

// ============================================================
//  ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА
// ============================================================
async function switchLang(newLang) {
  if (newLang === currentLang) return;
  saveState();                       // сохраняем прогресс текущего языка
  currentLang = newLang;
  localStorage.setItem('flashcards_last_lang', currentLang);
  hideBanner();
  await loadAndInit();
}

// ============================================================
//  ЗАГРУЗКА КАРТОЧЕК
// ============================================================
async function loadCards(url) {
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('Пустой JSON');
    return { cards: data, source: 'json' };
  } catch (e) {
    console.warn('Не удалось загрузить', url, ':', e);
    return { cards: FALLBACK[currentLang] || [], source: 'fallback', error: e };
  }
}

async function loadAndInit() {
  const conf = cfg();
  const { cards, source } = await loadCards(conf.file);
  allCards = cards;

  if (source === 'fallback') {
    showBanner(
      '⚠️ Не удалось загрузить ' + conf.file + ' — показаны демо-карточки. ' +
      'Проверьте, что файл лежит рядом с index.html и страница открыта через http(s).',
      'warn'
    );
  }

  const saved = loadSavedState();
  if (saved) restoreSession(saved);
  else startFresh();
}

// ============================================================
//  СОБЫТИЯ
// ============================================================
// Переключение языка
document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => switchLang(b.dataset.lang));
});

// Переключение подрежима
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    mode = t.dataset.mode;
    flipped = false; testState = null; matchState = null;
    render();
  });
});

// Карточки
$('cardScene').addEventListener('click', () => {
  if (!currentCard()) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});
fcKnowBtn.addEventListener('click', (e) => { e.stopPropagation(); markKnown(); });
fcRepeatBtn.addEventListener('click', (e) => { e.stopPropagation(); markRepeat(); });

// Тест
testCheckBtn.addEventListener('click', checkTest);
testNextBtn.addEventListener('click', markKnown);
testRepeatBtn.addEventListener('click', markRepeat);
testKnowBtn.addEventListener('click', markKnown);
testInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!testState || !testState.checked) checkTest();
    else if (testState.correct) markKnown();
  }
});

// Подбор
matchNextBtn.addEventListener('click', markKnown);
matchRepeatBtn.addEventListener('click', markRepeat);
matchKnowBtn.addEventListener('click', markKnown);

// Заново (только текущий язык)
$('restartBtn').addEventListener('click', () => {
  if (queue.length === 0 && learned.length === 0) return;
  if (!confirm('Сбросить прогресс и начать колоду «' + cfg().title + '» заново?')) return;
  clearSavedState();
  startFresh();
});

// Модалка
$('addBtn').addEventListener('click', openModal);
$('cancelModal').addEventListener('click', closeModal);
$('saveModal').addEventListener('click', saveNewCard);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

// Горячие клавиши
document.addEventListener('keydown', (e) => {
  if (modalOverlay.classList.contains('open')) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (e.target === testInput) return;

  if (e.code === 'Space') {
    if (mode === 'flashcard') { e.preventDefault(); $('cardScene').click(); }
  } else if (e.key === '1') {
    document.querySelector('.tab[data-mode="flashcard"]').click();
  } else if (e.key === '2') {
    document.querySelector('.tab[data-mode="test"]').click();
  } else if (e.key === '3') {
    document.querySelector('.tab[data-mode="match"]').click();
  } else if (e.key === 'q' || e.key === 'Q') {
    // Q — переключить язык
    switchLang(currentLang === 'latin' ? 'english' : 'latin');
  } else if (e.key.toLowerCase() === 'r') {
    $('restartBtn').click();
  }
});

// ============================================================
//  СТАРТ
// ============================================================
(async () => {
  // Запоминаем последний выбранный язык
  const last = localStorage.getItem('flashcards_last_lang');
  if (last && LANGS[last]) currentLang = last;

  await loadAndInit();
  window.addEventListener('beforeunload', saveState);
})();
</script>
</body>
</html>
